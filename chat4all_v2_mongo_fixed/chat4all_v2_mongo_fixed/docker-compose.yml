version: "3.9"

# Extensões para evitar repetição
x-mongo-kafka-env: &mongo-kafka-env
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: chat4all
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    build: ./api
    container_name: chat4all_api
    restart: unless-stopped
    environment:
      <<: *mongo-kafka-env
      MINIO_ENDPOINT: http://minio:9000
      MINIO_EXTERNAL_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat4all-files}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8082:8000"
    depends_on:
      - mongo
      - kafka
      - minio
    networks:
      - chat4all_net
    logging: *default-logging

  router:
    build: ./router
    container_name: chat4all_router
    restart: unless-stopped
    environment:
      <<: *mongo-kafka-env
    depends_on:
      - mongo
      - kafka
    networks:
      - chat4all_net
    logging: *default-logging

  worker:
    build: ./router
    container_name: chat4all_worker
    command: ["python", "-u", "worker.py"]
    restart: unless-stopped
    environment:
      <<: *mongo-kafka-env
    depends_on:
      - mongo
      - kafka
    networks:
      - chat4all_net
    logging: *default-logging

  mongo:
    image: mongo:6
    container_name: chat4all_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chat4all_net
    logging: *default-logging

  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    container_name: chat4all_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
    depends_on:
      - mongo
    networks:
      - chat4all_net
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: chat4all_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - chat4all_net
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: chat4all_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # CORREÇÃO DE REDE DO KAFKA:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - chat4all_net
    logging: *default-logging

  # --- O SERVIÇO QUE FALTAVA ---
  minio:
    image: minio/minio:latest
    container_name: chat4all_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - chat4all_net
    logging: *default-logging

  # --- OBSERVABILIDADE ---
  prometheus:
    image: prom/prometheus
    container_name: chat4all_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - chat4all_net

  grafana:
    image: grafana/grafana
    container_name: chat4all_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - chat4all_net

volumes:
  mongo_data:
  minio_data:
  kafka_data:
  zookeeper_data:

networks:
  chat4all_net:
    driver: bridge